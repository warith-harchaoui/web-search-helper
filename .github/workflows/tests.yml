name: tests

# lint runs ruff; test runs the suite on the core install (the hash embedder,
# no model download) with the PHP that ubuntu-latest ships, so the parity test
# between search.php and engine.py runs on every push.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.15.21"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: PHP is required by the parity and server tests
        run: php -v && php -m | grep -i mbstring
      - run: pip install -e ".[dev,api,mcp]"
      - run: python -m pytest
